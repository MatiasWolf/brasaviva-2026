<ion-content [fullscreen]="true" class="home-bg">
  @if (cargando()) {
    <div class="loader">
      <app-spinner-logo [size]="48"></app-spinner-logo>
      <p>Cargando tu menú...</p>
    </div>
  } @else {
    <div class="home-container">

      <header class="home-header">
        <div class="header-texts">
          <p class="eyebrow">Brasa Viva</p>
          <h1>{{ saludo() }}</h1>
          <span class="rol-chip">
            <ion-icon name="person-circle-outline"></ion-icon>
            {{ rolNombreLegible() | titlecase }}
          </span>
        </div>
        <ion-button
          fill="clear"
          class="logout-btn"
          (click)="cerrarSesion()"
          aria-label="Cerrar sesión"
        >
          <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
        </ion-button>
      </header>

      @if (esCliente()) {
        <app-tarjeta-usuario-home
          [nombre]="nombreCliente()"
          [apellido]="apellidoCliente()"
          [fotoUrl]="fotoCliente()"
          [dni]="dniCliente()"
          [estadoEtiqueta]="estadiaEtiqueta()"
        ></app-tarjeta-usuario-home>
      }

      <section class="menu-grid" [class.menu-grid--compacta]="botonesVisibles().length <= 3">
        @for (boton of botonesVisibles(); track boton.id) {
          <button type="button" class="menu-card" (click)="ejecutar(boton)">
            <span class="menu-card__icon">
              <ion-icon [name]="boton.icono"></ion-icon>
            </span>
            <span class="menu-card__title">{{ boton.titulo }}</span>
          </button>
        } @empty {
          <p class="sin-botones">No hay acciones disponibles en este momento.</p>
        }
      </section>

    </div>
  }

</ion-content>


@if (procesandoQr()) {
  <div class="qr-transition">
    <app-spinner-logo [size]="48"></app-spinner-logo>
    <p>Ingresando...</p>
  </div>
}
<app-qr-scanner
  [abierto]="mostrandoQrScanner()"
  (escaneado)="onQrEscaneado($event)"
  (cerrado)="cerrarQrScanner()">
</app-qr-scanner>

<app-resultado-qr-modal
  [abierto]="mostrandoResultadoQr()"
  [tipo]="resultadoQrTipo()"
  [titulo]="resultadoQrTitulo()"
  [mensaje]="resultadoQrMensaje()"
  (cerrado)="cerrarResultadoQr()">
</app-resultado-qr-modal>
