<ion-card class="tarjeta-individual">
  <ion-card-content>
    
    <!-- CONTENEDOR DE FOTOS INDIVIDUALES -->
    <div class="contenedor-carrusel">
      <!-- Botón Foto Anterior -->
      <ion-button fill="clear" (click)="cambiarFoto('anterior')">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>

      <!-- Visor de la foto activa -->
      <div class="visor-imagen">
        <img [src]="obtenerUrlFoto()" [alt]="producto.nombre" class="foto-menu" />
        <span class="contador-fotos">{{ fotoActivaIndex() + 1 }} / 3</span>
      </div>

      <!-- Botón Foto Siguiente -->
      <ion-button fill="clear" (click)="cambiarFoto('siguiente')">
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- DETALLES DEL PRODUCTO Y SELECCIÓN DE CANTIDADES (Punto 12) -->
    <div class="detalles-producto">
      <h2>{{ producto.nombre }}</h2>
      <div class="tiempo-elaboracion">
        <ion-icon name="time-outline"></ion-icon>
        <span> {{ producto.tiempo_preparacion }} min</span>
      </div>
      <p>{{ producto.descripcion }}</p>
      
      <!-- Contenedor inferior: Precio y Controladores de cantidad -->
      <div class="fila-precio-acciones">
        <span class="precio">${{ producto.precio }}</span>
        
        <div class="acciones-carrito">
          <!-- Restar unidad del pedido -->
          <ion-button fill="clear" (click)="alRestar.emit(producto.id)">
            <ion-icon name="remove-circle"></ion-icon>
          </ion-button>
          
          <!-- Badge con la cantidad actual en el carrito -->
          <ion-badge color="light">{{ cantidadEnCarrito }}</ion-badge>
          
          <!-- Agregar unidad al pedido -->
          <ion-button fill="clear" (click)="alAgregar.emit(producto)">
            <ion-icon name="add-circle"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>

  </ion-card-content>
</ion-card>
